[package]
name = "athenas-compiler"
version = "0.1.0"
edition = "2024"
description = "Athenas Knowledge Compiler — compiles engineering documentation into structured knowledge artifacts"
authors = ["SCP-00"]

[[bin]]
name = "ath"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false }
walkdir = "2"
jsonschema = "0.29"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
colored = "3"
