# Athenas Ontology
# This file defines ALL official vocabulary for the project.
# Agents and humans must use these definitions.
# No ambiguity is tolerated.

Model:
  id: ONT-0001
  description: >
    A set of neural network weights, typically produced by training.
    A Model is immutable — it does not change after training.
  examples:
    - Qwen3.5-9B
    - Llama-3.2-8B
  properties:
    - architecture (transformer, Mamba, MoE)
    - parameter_count
    - training_data
    - license
  related:
    - Quant: "A Model can be quantized into multiple Quants"
    - Runtime: "A Model is executed by a Runtime"
    - Profile: "A Profile defines how a Model is executed"

Quant:
  id: ONT-0002
  description: >
    A specific compression implementation applied to a Model.
    A Quant is the combination of a Model + quantization algorithm + parameters.
  examples:
    - Qwen3.5-9B-IQ3_XXS
    - Llama-3.2-8B-Q4_K_M
  properties:
    - base_model
    - algorithm (IQ3_XXS, Q4_K_M, Q8_0)
    - file_size
    - bit_width
  related:
    - Model: "A Quant is derived from a Model"
    - Profile: "A Profile selects a specific Quant"

Runtime:
  id: ONT-0003
  description: >
    A software system capable of executing a Model (or Quant) on hardware.
    Runtimes are interchangeable — Athenas depends on the Runtime Interface,
    not any specific Runtime.
  examples:
    - llama.cpp
    - vLLM
    - MLX
    - Ollama
    - LM Studio
  properties:
    - name
    - version
    - supported_hardware
    - supported_quantizations
    - provider_interface
  related:
    - Profile: "A Profile targets a specific Runtime"
    - Model: "A Runtime executes Models"

Profile:
  id: ONT-0004
  description: >
    An execution policy. A Profile specifies how a Model/Quant is executed
    on a Runtime. It is NOT the model itself — it is the policy that governs
    execution.
  examples:
    - Research Profile (262K ctx, temp 0.3, parallel 1)
    - Coding Profile (64K ctx, temp 0.15, grammar-constrained)
  properties:
    - max_context
    - temperature
    - samplers
    - batch_size
    - speculative_decoding (true/false)
    - grammar
  related:
    - Runtime: "A Profile is executed by a Runtime"
    - Model: "A Profile targets a Model"
    - Quant: "A Profile uses a specific Quant"

Capability:
  id: ONT-0005
  description: >
    A measurable functionality that a Model can perform.
    Capabilities are the unit of certification in Athenas.
  examples:
    - OCR (image to text)
    - Coding (code generation)
    - Reasoning (multi-step logic)
    - Retrieval (long-context recall)
  properties:
    - name
    - description
    - measurement_method
    - benchmark_reference
  related:
    - Model: "A Model implements Capabilities"
    - BENCH: "A Benchmark measures a Capability"

Evidence:
  id: ONT-0006
  description: >
    A validated experimental result. Evidence is the atomic unit of proof
    in Athenas. Every claim must be supported by Evidence.
  examples:
    - BENCH-0007 (TTFT measurement for Qwen3.5 on RTX3050)
  properties:
    - claim_id
    - confidence (0.0-1.0)
    - hardware_used
    - runtime_used
    - conditions
    - raw_data
    - reproducibility_hash
  related:
    - BENCH: "Evidence is produced by Benchmarks"
    - Experiment: "Evidence is derived from Experiments"

EvidencePackage:
  id: ONT-0007
  description: >
    A collection of Evidence items that together support a certification
    decision. Not a single benchmark — an Evidence Package is a decision-ready
    artifact.
  examples:
    - Model Certification Report
    - Profile Validation Package
  properties:
    - model
    - capabilities_tested
    - evidence_items
    - aggregate_score
    - certification_decision
  related:
    - Evidence: "Contains multiple Evidence items"
    - Model: "Certifies a Model"
    - Profile: "Validates a Profile"

Certification:
  id: ONT-0008
  description: >
    The process of evaluating a Model/Quant/Profile against a set of
    Capabilities and producing a Certification Decision (KEEP, ARCHIVE, REJECT).
    Certification is the core value of Athenas.
  properties:
    - subject (model/quant/profile)
    - pipeline_steps
    - results
    - decision (KEEP | ARCHIVE | REJECT)
    - timestamp
  related:
    - EvidencePackage: "Produces an Evidence Package"
    - Model: "Certifies Models"
    - Capability: "Tests Capabilities"

RuntimeProfile:
  id: ONT-0009
  description: >
    ALIAS: "Profile". Deprecated term. Use "Profile" instead.
  status: deprecated
  superseded_by: "Profile (ONT-0004)"

ExecutionUnit:
  id: ONT-0010
  description: >
    An executable procedure. Replaces the ambiguous term "script".
    An ExecutionUnit has defined inputs, outputs, contracts, and error modes.
  examples:
    - benchmark-runner
    - model-downloader
    - certification-pipeline
  properties:
    - interface (inputs, outputs, contracts, errors)
    - language
    - runtime_dependencies
  related:
    - Tool: "ExecutionUnits can be composed into Tools"

CertifiedDefault:
  id: ONT-0011
  description: >
    The officially recommended Model/Quant/Profile combination for a given
    hardware configuration and use case. NEVER call this "recommended model".
  related:
    - Model: "A Certified Default includes a Model"
    - Profile: "A Certified Default includes a Profile"
    - Certification: "Requires formal Certification"

CapabilityLeader:
  id: ONT-0012
  description: >
    The Model with the highest Certified score for a specific Capability
    on a specific hardware configuration. NEVER call this "best model".
  related:
    - Model: "A specific Model holds the leader position"
    - Capability: "For a specific Capability"
    - Certification: "Based on Certification results"

KnowledgeGraph:
  id: ONT-0013
  description: >
    The conceptual model that connects every entity in Athenas.
    The Knowledge Graph is not a database — it is the logical topology
    of all engineering knowledge in the project.
  properties:
    - nodes (all entities: models, profiles, documents, experiments)
    - edges (all relationships: implements, validates, depends_on)
  related:
    - ALL entities in this ontology

EngineeringLog:
  id: ONT-0014
  description: >
    A daily record of engineering activity. Not a journal — a structured
    artifact containing: what was done, what was learned, what failed,
    and what comes next.

Document:
  id: ONT-0015
  description: >
    Any authored artifact in the Athenas system. Every Document has an ID,
    authority level, status, and explicit relationships to other Documents.
  properties:
    - id (PREFIX-NNNN)
    - authority_level (0-8)
    - status (Draft, Review, Approved, Superseded, Archived)
    - relationships (implements, depends_on, validates, etc.)
  related:
    - All types: "Documents include all CONST, DIRECTIVE, REQ, SPEC, etc."
