id: pack-go
name: Go Programming
version: 1.0.0
description: Complete Go development knowledge — syntax, toolchain, debugging, testing, modules, and best practices
tags:
  - go
  - golang
  - backend
  - systems
depends_on: []
languages:
  - go

tools:
  - name: go-compiler
    command: go build
    description: Compile and build Go packages
    check: go version
  - name: go-tester
    command: go test
    description: Run Go tests with coverage
    check: go version
  - name: go-fmt
    command: gofmt -l
    description: Format Go source code
    check: gofmt -h
  - name: go-linter
    command: golangci-lint run
    description: Comprehensive Go linter
    check: golangci-lint version
  - name: go-debugger
    command: dlv debug
    description: Debug Go programs with Delve
    check: dlv version
  - name: go-mod
    command: go mod tidy
    description: Manage Go module dependencies
    check: go version

prompts:
  system: |
    You are an expert Go developer. Follow these strict conventions:

    CODE STYLE:
    - Use gofmt formatting (tabs for indentation)
    - Explicit error handling with if err != nil { return }
    - Prefer composition over inheritance
    - Use interfaces small (1-3 methods)
    - Named returns only when documenting

    ERROR HANDLING:
    - Never ignore errors with _
    - Wrap errors with fmt.Errorf("context: %w", err)
    - Use errors.Is() and errors.As() for sentinel errors
    - Defer close() and check the error

    CONCURRENCY:
    - Use sync.WaitGroup for goroutine coordination
    - Use context.Context for cancellation
    - Channels for communication, mutexes for state
    - Always close channels from the sender side

    TESTING:
    - Table-driven tests with t.Run()
    - Use testing/suite for complex setups
    - Benchmark functions in _test.go files
    - Use httptest for HTTP handlers

    MODULES:
    - Semantic import versioning
    - Minimal dependency surface
    - Use go mod tidy after changes

    COMMON MISTAKES TO AVOID:
    - Shadowed variables in if blocks
    - Loop variable capture (pre-go1.22)
    - Non-atomic pointer dereference
    - Missing nil checks on interface values

  error_analysis: |
    When analyzing Go compilation errors:

    1. READ the full error output — Go errors include file:line:column
    2. Classify the error:
       - syntax: misspelled keyword, missing brace, wrong import path
       - type mismatch: wrong type for variable, function signature mismatch
       - undefined: missing import, typo in identifier, unexported name
       - unused: unused variable or import (Go treats these as errors)
       - vet: suspicious constructs caught by go vet
    3. For each error:
       a. Open the file at the reported line
       b. Understand the expected vs actual
       c. Propose the fix
       d. Verify with go build or go vet
    4. NEVER propose a fix without understanding the root cause

  constraints: |
    CONSTRAINTS:
    - Generated code MUST compile with go build ./...
    - All public APIs must have doc comments
    - Use standard library before third-party packages
    - Produce idiomatic Go — if it looks like Java, it's wrong

knowledge:
  - title: Go Project Structure
    content: |
      Standard Go project layout:
      ```
      project/
        cmd/app/main.go     — entry point
        internal/            — private packages
        pkg/                 — public packages
        api/                 — API definitions
        migrations/          — database migrations
        go.mod
        go.sum
        Makefile
      ```

  - title: Common Go Patterns
    content: |
      Option Pattern:
      ```go
      type Config struct { Timeout time.Duration }
      type Option func(*Config)
      func WithTimeout(d time.Duration) Option {
          return func(c *Config) { c.Timeout = d }
      }
      func New(opts ...Option) *Config {
          c := &Config{Timeout: 30 * time.Second}
          for _, opt := range opts { opt(c) }
          return c
      }
      ```

  - title: Go HTTP Server Best Practices
    content: |
      ```go
      mux := http.NewServeMux()
      mux.HandleFunc("GET /health", healthHandler)
      server := &http.Server{
          Addr:         ":8080",
          Handler:      mux,
          ReadTimeout:  10 * time.Second,
          WriteTimeout: 30 * time.Second,
      }
      // Graceful shutdown
      sig := make(chan os.Signal, 1)
      signal.Notify(sig, syscall.SIGINT, syscall.SIGTERM)
      <-sig
      ctx, cancel := context.WithTimeout(context.Background(), 5*time.Second)
      defer cancel()
      server.Shutdown(ctx)
      ```

  - title: Go Testing Patterns
    content: |
      Table-driven tests:
      ```go
      func TestAdd(t *testing.T) {
          tests := []struct {
              name string
              a, b int
              want int
          }{
              {"positive", 1, 2, 3},
              {"negative", -1, -2, -3},
              {"zero", 0, 0, 0},
          }
          for _, tt := range tests {
              t.Run(tt.name, func(t *testing.T) {
                  if got := Add(tt.a, tt.b); got != tt.want {
                      t.Errorf("Add() = %v, want %v", got, tt.want)
                  }
              })
          }
      }
      ```

  - title: Go Module Management
    content: |
      Essential commands:
      - go mod init <module-path>
      - go mod tidy — clean up dependencies
      - go mod verify — verify dependencies haven't been modified
      - go list -m all — list all dependencies
      - go get <package>@<version> — add/update dependency
      Use replace directives for local development:
      replace example.com/pkg => ../local/pkg

benchmarks:
  - description: Write a complete Go HTTP server with health check, graceful shutdown, and structured logging
    prompt: "Write a complete Go HTTP server that listens on :8080, has a /health endpoint returning JSON status with uptime, implements graceful shutdown, and uses structured logging with slog. Include the main function and all necessary types."
    expected_output: "Compilable Go program with no errors"
    max_tokens: 400
  - description: Implement a concurrent worker pool in Go
    prompt: "Implement a worker pool in Go that processes jobs concurrently. Include: Job struct with ID and payload, WorkerPool with configurable size, graceful shutdown, error collection, and a test file using table-driven tests."
    expected_output: "Compilable Go program with working tests"
    max_tokens: 400
