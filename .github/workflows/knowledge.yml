# Knowledge Workflow
# Builds knowledge artifacts via ath compiler.

name: Knowledge

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build ath compiler
        run: cargo build --manifest-path crates/athenas-compiler/Cargo.toml --release

      - name: ath — compile knowledge artifacts
        run: |
          ./crates/athenas-compiler/target/release/ath

      - name: Verify artifacts
        run: |
          missing=0
          for f in graph.json index.json timeline.json decisions.json diagnostics.json references.json ontology.json summary.json; do
            if [ -f ".knowledge/$f" ]; then
              echo "  ✓ $f ($(wc -c < ".knowledge/$f") bytes)"
            else
              echo "  ⚠ $f not generated yet (expected in future passes)"
              missing=$((missing + 1))
            fi
          done
          echo ""
          echo "$missing files pending"

      - name: Summary
        run: |
          echo "## Knowledge Build" >> $GITHUB_STEP_SUMMARY
          echo "Compiler completed. Artifacts in .knowledge/" >> $GITHUB_STEP_SUMMARY

      - name: Upload knowledge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knowledge
          path: .knowledge/
