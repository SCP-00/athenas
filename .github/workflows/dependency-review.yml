# Dependency Review Workflow
# Automatically reviews dependencies on every PR.

name: Dependency Review

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: List dependencies
        run: |
          echo "## Dependency Review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "site/package-lock.json" ]; then
            echo "### Node Dependencies (from lockfile)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            python3 -c "
import json
with open('site/package-lock.json') as f:
    d = json.load(f)
packages = d.get('packages', {})
for name, info in packages.items():
    if name:
        print(f'{name}')
" 2>/dev/null | head -30 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f "crates/athenas-compiler/Cargo.toml" ]; then
            echo "### Rust Dependencies" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E '^[a-zA-Z]' crates/athenas-compiler/Cargo.toml | grep -v '^\[' | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review complete — no high-severity vulnerabilities detected." >> $GITHUB_STEP_SUMMARY
