name: Validate & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Athenas Compiler
        run: cargo build --manifest-path crates/athenas-compiler/Cargo.toml --release

      - name: Run Knowledge Compiler
        run: ./crates/athenas-compiler/target/release/athenas

      - name: Validate YAML files
        run: |
          python3 << 'PYEOF'
import yaml, os
errors = 0
for root, dirs, files in os.walk('.'):
    for f in files:
        if f.endswith(('.yaml', '.yml')) and all(x not in root for x in ['node_modules', '.git', 'target']):
            try:
                with open(os.path.join(root, f)) as fh:
                    yaml.safe_load(fh)
            except Exception as e:
                print(f'FAIL: {os.path.join(root, f)}: {e}')
                errors += 1
print(f'YAML errors: {errors}')
PYEOF

      - name: Validate document IDs
        run: |
          python3 << 'PYEOF'
import os, re
valid = set('CONST VISION REQ SPEC ARCH ADR EXP BENCH MODEL PROFILE CAP TASK TOOL EVID DIRECTIVE INDEX CONTEXT BOOTSTRAP ONT'.split())
errors = 0
for root, dirs, files in os.walk('.'):
    for f in files:
        if f.endswith('.md') and all(x not in root for x in ['templates', 'node_modules', '.git', 'site']):
            path = os.path.join(root, f)
            with open(path) as fh:
                first_line = fh.readline().strip()
                if first_line.startswith('# '):
                    prefix = first_line[2:].split()[0].split('-')[0]
                    if prefix not in valid:
                        print(f'UNKNOWN: {prefix} in {path}')
                        errors += 1
print(f'ID errors: {errors}')
PYEOF

      - name: Validate front-matter and references
        run: |
          python3 << 'PYEOF'
import os, re
ids = {}
frontmatter_errors = 0
ref_errors = 0
for root, dirs, files in os.walk('.'):
    for f in files:
        if f.endswith('.md') and all(x not in root for x in ['templates', 'node_modules', '.git', 'site']):
            path = os.path.join(root, f)
            with open(path) as fh:
                content = fh.read().strip()
                if not content.startswith('---'):
                    print(f'MISSING front-matter: {path}')
                    frontmatter_errors += 1
            m = re.search(r'^id:\s*(\S+)', content, re.MULTILINE)
            if m:
                ids[m.group(1)] = path
# Check references
for root, dirs, files in os.walk('.'):
    for f in files:
        if f.endswith('.md') and all(x not in root for x in ['node_modules', '.git']):
            path = os.path.join(root, f)
            with open(path) as fh:
                refs = set(re.findall(r'\b[A-Z]+-\d{4}\b', fh.read()))
            for ref in refs:
                if ref not in ids:
                    print(f'BROKEN REF: {ref} in {path}')
                    ref_errors += 1
print(f'Front-matter errors: {frontmatter_errors}')
print(f'Reference errors: {ref_errors}')
PYEOF

      - name: Validate ontology
        run: |
          python3 << 'PYEOF'
import yaml
with open('knowledge/ontology.yaml') as f:
    data = yaml.safe_load(f)
terms = list(data.keys())
print(f'Terms: {len(terms)}')
for t in terms:
    print(f'  - {t}')
PYEOF

      - name: Build documentation summary
        run: |
          echo "## Active Documents" >> $GITHUB_STEP_SUMMARY
          echo '| ID | Title | Status | Path |' >> $GITHUB_STEP_SUMMARY
          echo '|---|---|---|---|' >> $GITHUB_STEP_SUMMARY
          find . -name '*.md' -not -path './node_modules/*' -not -path './.git/*' -not -path './site/*' | while read f; do
            id=$(grep -m1 '^id:' "$f" | sed 's/^id: *//')
            title=$(grep -m1 '^title:' "$f" | sed 's/^title: *//')
            status=$(grep -m1 '^status:' "$f" | sed 's/^status: *//')
            [ -n "$id" ] && echo "| $id | $title | $status | $f |" >> $GITHUB_STEP_SUMMARY
          done

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Compiler
        run: cargo build --manifest-path crates/athenas-compiler/Cargo.toml --release

      - name: Run Compiler (generate .knowledge/)
        run: ./crates/athenas-compiler/target/release/athenas

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Build Astro Site
        run: npm run build
        working-directory: site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/dist/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
