# Validate Workflow
# Pure validation via ath validate subcommand.
# All intelligence lives in the compiler.

name: Validate

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build ath compiler
        run: cargo build --manifest-path crates/athenas-compiler/Cargo.toml --release

      - name: ath validate — schema, IDs, references, diagnostics, exit code
        run: |
          ./crates/athenas-compiler/target/release/ath validate

      - name: Summary
        if: always()
        run: |
          echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "Compiler validation completed via \`ath validate\`." >> $GITHUB_STEP_SUMMARY
