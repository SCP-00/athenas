# Validate Workflow
# Pure validation via ath compiler — all intelligence lives in the compiler.
# GitHub Actions is a thin execution layer for the compiler.

name: Validate

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build ath compiler
        run: cargo build --manifest-path crates/athenas-compiler/Cargo.toml --release

      - name: ath — run all passes (validation, graph, diagnostics)
        run: |
          ./crates/athenas-compiler/target/release/ath

      - name: Summary
        if: always()
        run: |
          echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "Compiler completed successfully." >> $GITHUB_STEP_SUMMARY
