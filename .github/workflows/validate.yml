name: Validate & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Athenas Compiler
        run: cargo build --manifest-path crates/athenas-compiler/Cargo.toml --release

      - name: Run Knowledge Compiler
        run: |
          ./crates/athenas-compiler/target/release/athenas

      - name: Check YAML files are valid
        run: |
          python3 << 'PYEOF'
import yaml, os
errors = 0
for root, dirs, files in os.walk('.'):
    for f in files:
        if f.endswith(('.yaml', '.yml')) and 'node_modules' not in root and '.git' not in root:
            try:
                with open(os.path.join(root, f)) as fh:
                    yaml.safe_load(fh)
            except Exception as e:
                print(f'FAIL: {os.path.join(root, f)}: {e}')
                errors += 1
print(f'Errors: {errors}')
PYEOF

      - name: Validate document IDs
        run: |
          python3 << 'PYEOF'
import os, re
valid = set('CONST VISION REQ SPEC ARCH ADR EXP BENCH MODEL PROFILE CAP TASK TOOL EVID DIRECTIVE INDEX CONTEXT BOOTSTRAP ONT'.split())
errors = 0
for root, dirs, files in os.walk('.'):
    for f in files:
        if f.endswith('.md') and 'templates' not in root and 'node_modules' not in root and '.git' not in root and 'site' not in root:
            path = os.path.join(root, f)
            with open(path) as fh:
                first_line = fh.readline().strip()
                if first_line.startswith('# '):
                    prefix = first_line[2:].split()[0].split('-')[0]
                    if prefix not in valid:
                        print(f'UNKNOWN PREFIX: {prefix} in {path}')
                        errors += 1
print(f'Errors: {errors}')
PYEOF

      - name: Check YAML front-matter
        run: |
          python3 << 'PYEOF'
import os
errors = 0
for root, dirs, files in os.walk('.'):
    for f in files:
        if f.endswith('.md') and 'templates' not in root and 'node_modules' not in root and '.git' not in root and 'site' not in root:
            path = os.path.join(root, f)
            with open(path) as fh:
                content = fh.read().strip()
                if not content.startswith('---'):
                    print(f'MISSING front-matter: {path}')
                    errors += 1
print(f'Errors: {errors}')
PYEOF

      - name: Check reference integrity
        run: |
          python3 << 'PYEOF'
import os, re
ids = set()
for root, dirs, files in os.walk('.'):
    for f in files:
        if f.endswith('.md') and 'node_modules' not in root and '.git' not in root:
            with open(os.path.join(root, f)) as fh:
                m = re.search(r'^id:\s*(\S+)', fh.read(), re.MULTILINE)
                if m:
                    ids.add(m.group(1))
errors = 0
for root, dirs, files in os.walk('.'):
    for f in files:
        if f.endswith('.md') and 'node_modules' not in root and '.git' not in root:
            path = os.path.join(root, f)
            with open(path) as fh:
                refs = set(re.findall(r'\b[A-Z]+-\d{4}\b', fh.read()))
            for ref in refs:
                if ref not in ids:
                    print(f'BROKEN REF: {ref} in {path}')
                    errors += 1
print(f'Errors: {errors}')
PYEOF

      - name: Validate ontology
        run: |
          python3 << 'PYEOF'
import yaml
with open('knowledge/ontology.yaml') as f:
    data = yaml.safe_load(f)
print(f'Ontology loaded: {len(data)} terms')
for t in data:
    print(f'  - {t}')
PYEOF

      - name: Build documentation summary
        run: |
          echo "## Active Documents" >> $GITHUB_STEP_SUMMARY
          echo '| ID | Title | Status | Path |' >> $GITHUB_STEP_SUMMARY
          echo '|---|---|---|---|' >> $GITHUB_STEP_SUMMARY
          find . -name '*.md' -not -path './node_modules/*' -not -path './.git/*' -not -path './site/*' | while read f; do
            id=$(grep -m1 '^id:' "$f" | sed 's/^id: *//')
            title=$(grep -m1 '^title:' "$f" | sed 's/^title: *//')
            status=$(grep -m1 '^status:' "$f" | sed 's/^status: *//')
            [ -n "$id" ] && echo "| $id | $title | $status | $f |" >> $GITHUB_STEP_SUMMARY
          done

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Compiler
        run: cargo build --manifest-path crates/athenas-compiler/Cargo.toml --release

      - name: Run Compiler
        run: ./crates/athenas-compiler/target/release/athenas

      - name: Build Astro Site
        run: |
          cd site
          npm install
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/dist/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-deploy:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment
        run: |
          echo "Site deployed to: https://SCP-00.github.io/athenas"
